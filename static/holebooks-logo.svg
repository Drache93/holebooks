<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2210"/>
      <stop offset="100%" stop-color="#5c3a1e"/>
    </linearGradient>
    <linearGradient id="spine1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7b4f2e"/>
      <stop offset="100%" stop-color="#5c3317"/>
    </linearGradient>
    <linearGradient id="spine2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c6e3c"/>
      <stop offset="100%" stop-color="#7a5028"/>
    </linearGradient>
    <linearGradient id="spine3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3020"/>
      <stop offset="100%" stop-color="#2e2418"/>
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect x="0" y="0" width="400" height="120" rx="16" fill="url(#bg)"/>

  <!-- Subtle texture lines -->
  <rect x="0" y="0" width="400" height="120" rx="16" fill="none" stroke="#c8a97a" stroke-width="1" opacity="0.15"/>

  <!-- Book stack icon — 3 books as spines -->

  <!-- Book 3 (back, tallest) -->
  <rect x="22" y="22" width="18" height="76" rx="2" fill="url(#spine3)"/>
  <rect x="24" y="25" width="14" height="70" rx="1" fill="none" stroke="#e8d8c0" stroke-width="0.5" opacity="0.3"/>
  <!-- Spine highlight -->
  <rect x="22" y="22" width="3" height="76" rx="1" fill="#fff" opacity="0.06"/>

  <!-- Book 2 (middle) -->
  <rect x="40" y="28" width="20" height="70" rx="2" fill="url(#spine1)"/>
  <rect x="42" y="31" width="16" height="64" rx="1" fill="none" stroke="#f5e6d3" stroke-width="0.5" opacity="0.3"/>
  <rect x="40" y="28" width="3" height="70" rx="1" fill="#fff" opacity="0.06"/>

  <!-- Book 1 (front, shorter) -->
  <rect x="60" y="32" width="22" height="66" rx="2" fill="url(#spine2)"/>
  <rect x="62" y="35" width="18" height="60" rx="1" fill="none" stroke="#f5e8d0" stroke-width="0.5" opacity="0.3"/>
  <rect x="60" y="32" width="3" height="66" rx="1" fill="#fff" opacity="0.07"/>

  <!-- Book pages suggestion (top edge) -->
  <rect x="23" y="20" width="16" height="3" rx="0.5" fill="#f0e0c0" opacity="0.6"/>
  <rect x="41" y="26" width="18" height="3" rx="0.5" fill="#f0e0c0" opacity="0.6"/>
  <rect x="61" y="30" width="20" height="3" rx="0.5" fill="#f0e0c0" opacity="0.6"/>

  <!-- Bookmark ribbon on front book -->
  <path d="M75 30 L75 18 L81 18 L81 30 L78 27 Z" fill="#c8a97a" opacity="0.85"/>

  <!-- Wordmark: Hole -->
  <text x="102" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#f5eed8" letter-spacing="-1">Hole</text>

  <!-- Wordmark: books — slightly lighter/different weight -->
  <text x="102" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="transparent">Hole</text>
  <text x="214" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="400" fill="#c8a97a" letter-spacing="-1">books</text>

  <!-- Tagline -->
  <text x="103" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#a07850" letter-spacing="0.02em">Your reading journey</text>

  <!-- Decorative dot separator between name and tagline baseline -->
  <circle cx="96" cy="82" r="2.5" fill="#c8a97a" opacity="0.5"/>
</svg>
